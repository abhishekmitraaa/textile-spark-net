name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start preview server
        run: npx vite preview --port 8080 &

      - name: Wait for preview
        run: |
          echo "Waiting for preview server to be available..."
          sleep 6

      - name: Run Playwright tests
        run: npx playwright test --reporter=github
        # Test logins come from repository secrets (Master Prompt 8, Phase 1);
        # specs that need an unset one skip instead of failing to sign in.
        env:
          DEMO_BUYER_PASSWORD: ${{ secrets.DEMO_BUYER_PASSWORD }}
          DEMO_VENDOR_PASSWORD: ${{ secrets.DEMO_VENDOR_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          MP_VENDOR_PASSWORD: ${{ secrets.MP_VENDOR_PASSWORD }}
          MP5_LINK_PASSWORD: ${{ secrets.MP5_LINK_PASSWORD }}
          TEST_VENDOR_PASSWORD: ${{ secrets.TEST_VENDOR_PASSWORD }}
          FIXTURE_PASSWORD: ${{ secrets.FIXTURE_PASSWORD }}
