# ── Edge function auth ──
#
# By default the CLI deploys every function with verify_jwt = true, which makes
# the platform reject any request without a valid Supabase JWT *before* the
# handler runs. That is correct for the four functions the browser calls (they
# read the vendor id out of the caller's JWT), but fatal for the two Razorpay
# webhooks: Razorpay posts server-to-server with only an
# `x-razorpay-signature` header, so a JWT gate would 401 every callback and the
# "browser closed before verify-payment ran" backstop would silently never fire.
#
# The webhooks are not unauthenticated — they authenticate the *payload*
# instead, via HMAC-SHA256 of the raw body against RAZORPAY_WEBHOOK_SECRET, and
# reject a mismatch with a 400. See supabase/functions/razorpay-webhook and
# subscription-webhook.

[functions.razorpay-webhook]
verify_jwt = false

[functions.subscription-webhook]
verify_jwt = false

# Browser-called functions keep the default JWT gate.
[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify-payment]
verify_jwt = true

[functions.subscription-create-order]
verify_jwt = true

[functions.subscription-verify-payment]
verify_jwt = true

# Discount quotes at checkout (admin completion Phase 10). Reads the vendor id out
# of the JWT like the payment functions, so the gate is load-bearing for the same
# reason: without it anyone could quote, and spend guessing attempts, as any vendor.
[functions.discount-quote]
verify_jwt = true

# Bunny Stream. These are load-bearing, not decorative: all three functions read
# the caller's id by base64-decoding the JWT payload WITHOUT verifying its
# signature, exactly as the payment functions do. That is only sound because the
# platform has already validated the token by the time the handler runs. Remove
# verify_jwt = true here and any anonymous caller could mint upload slots, or
# delete another vendor's video, by hand-writing a `sub` claim.
[functions.bunny-upload-url]
verify_jwt = true

[functions.bunny-delete-video]
verify_jwt = true

[functions.bunny-reconcile]
verify_jwt = true

# Embedding worker. Called by pg_cron via pg_net, never by a browser. The handler
# additionally requires the caller's JWT to carry role = 'service_role', which is
# only meaningful because verify_jwt = true has already validated the signature —
# the same layering the bunny-* functions rely on. Without that second check any
# holder of the public anon key could invoke it and burn OpenAI credits.
[functions.generate-embedding]
verify_jwt = true

# Query-embedding cache warmer. Unlike generate-embedding this IS a buyer-facing
# endpoint (the search box calls it), so it has no service_role check — the JWT
# gate is the whole gate. It returns a status only, never the vector, and a
# cached term costs one indexed lookup with no OpenAI call.
[functions.embed-query]
verify_jwt = true

# "Delete my account", step 1 (2026-09-23). Reads the caller's id from the JWT
# payload without verifying it, like bunny-*, so this gate is load-bearing:
# without it anyone could hand-write a `sub` and have a deletion code minted
# for another account (the code still only goes to that account's own inbox,
# but the request row and the email would be theirs to trigger).
[functions.account-deletion]
verify_jwt = true

# "Delete my account", step 4 (2026-09-24): the daily sweep, posted to by pg_cron
# with the service-role key from Vault. The handler also requires role =
# service_role; this gate is what makes that claim trustworthy.
[functions.account-deletion-sweep]
verify_jwt = true

# Display-only currency conversion (MPF-11, 2026-09-24): the daily FX-rate refresh,
# posted to by pg_cron with the service-role key from Vault. The handler also
# requires role = service_role; this gate is what makes that claim trustworthy.
[functions.fx-rates-refresh]
verify_jwt = true

# FAQ snapshots for the Storage CDN (Phase 9 Q2, 2026-09-24): posted to by the
# trg_faqs_snapshot trigger and the hourly faq-snapshots-refresh cron job, with the
# service-role key from Vault. The handler also requires role = service_role.
[functions.faqs-snapshot]
verify_jwt = true

# The site-config snapshot (admin completion Phase 9, 2026-09-29): the theme and the
# vendor-dashboard banners as one CDN file. Posted to by the site-table triggers and the
# hourly faq-snapshots-refresh job, with the service-role key from Vault. The handler
# also requires role = service_role.
[functions.site-config-snapshot]
verify_jwt = true

# Dummy OTP for mobile sign-in (2026-09-27): accepts any 6 digits and returns a
# session, until SMS delivery exists. A sign-in bypass by design, logged in
# documentation/securityflags.md. Called from the signed-out browser with the
# anon key, so this gate only keeps out callers without the project's key; the
# kill switch is the OTP_DEV_BYPASS=off secret.
[functions.otp-dev-verify]
verify_jwt = true

# Help & Support (plan A4): checks an uploaded support file's signature before it is
# shown. The platform verifies the JWT; the function reads the uploader from the row.
[functions.support-attachment-verify]
verify_jwt = true

# Help & Support P6 (2026-10-01): the email receipt for feedback and fraud reports, called
# by the signed-in requester. The platform verifies the JWT; the function reads `sub`.
[functions.support-receipt]
verify_jwt = true

# Help & Support P6 (2026-10-01): the support sweep (auto-close, missed callback windows,
# the deletions). Posted to by the support-sweep cron job once it is approved, with the
# service-role key from Vault. The handler also requires role = service_role.
[functions.support-sweep]
verify_jwt = true

# Subscriptions P1 (2026-10-08): catches plan payments that reached Razorpay but never
# reached us. Posted to by the billing-reconcile cron job (approved 2026-10-08) with the
# service-role key from Vault; the handler also requires role = service_role.
[functions.billing-reconcile]
verify_jwt = true

# Subscriptions P1 (2026-10-08): renders an invoice as a PDF for its vendor (or a finance
# or support admin) and answers a 5-minute signed link. The caller is confirmed by Auth.
[functions.invoice-render]
verify_jwt = true

# Subscriptions P2 (2026-10-08): sends what the notification outbox has due (email,
# WhatsApp, SMS). Posted to every minute by the notification-dispatch cron job (once
# approved) with the service-role key from Vault; the handler also requires role = service_role.
[functions.notification-dispatch]
verify_jwt = true

# Subscriptions P3 (2026-10-08): autopay through Razorpay Subscriptions (start, verify,
# cancel). Browser-called; the caller is confirmed by Auth.
[functions.subscription-autopay]
verify_jwt = true
