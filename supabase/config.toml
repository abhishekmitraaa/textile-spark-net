# ── Edge function auth ──
#
# By default the CLI deploys every function with verify_jwt = true, which makes
# the platform reject any request without a valid Supabase JWT *before* the
# handler runs. That is correct for the four functions the browser calls (they
# read the vendor id out of the caller's JWT), but fatal for the two Razorpay
# webhooks: Razorpay posts server-to-server with only an
# `x-razorpay-signature` header, so a JWT gate would 401 every callback and the
# "browser closed before verify-payment ran" backstop would silently never fire.
#
# The webhooks are not unauthenticated — they authenticate the *payload*
# instead, via HMAC-SHA256 of the raw body against RAZORPAY_WEBHOOK_SECRET, and
# reject a mismatch with a 400. See supabase/functions/razorpay-webhook and
# subscription-webhook.

[functions.razorpay-webhook]
verify_jwt = false

[functions.subscription-webhook]
verify_jwt = false

# Browser-called functions keep the default JWT gate.
[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify-payment]
verify_jwt = true

[functions.subscription-create-order]
verify_jwt = true

[functions.subscription-verify-payment]
verify_jwt = true

# Bunny Stream. These are load-bearing, not decorative: all three functions read
# the caller's id by base64-decoding the JWT payload WITHOUT verifying its
# signature, exactly as the payment functions do. That is only sound because the
# platform has already validated the token by the time the handler runs. Remove
# verify_jwt = true here and any anonymous caller could mint upload slots, or
# delete another vendor's video, by hand-writing a `sub` claim.
[functions.bunny-upload-url]
verify_jwt = true

[functions.bunny-delete-video]
verify_jwt = true

[functions.bunny-reconcile]
verify_jwt = true

# Embedding worker. Called by pg_cron via pg_net, never by a browser. The handler
# additionally requires the caller's JWT to carry role = 'service_role', which is
# only meaningful because verify_jwt = true has already validated the signature —
# the same layering the bunny-* functions rely on. Without that second check any
# holder of the public anon key could invoke it and burn OpenAI credits.
[functions.generate-embedding]
verify_jwt = true

# Query-embedding cache warmer. Unlike generate-embedding this IS a buyer-facing
# endpoint (the search box calls it), so it has no service_role check — the JWT
# gate is the whole gate. It returns a status only, never the vector, and a
# cached term costs one indexed lookup with no OpenAI call.
[functions.embed-query]
verify_jwt = true
